<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Kova Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <!-- Official Cloudflare Turnstile Script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #030712;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      background: #0b1736;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .auth-brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .step-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .step-box.active {
      display: flex;
    }

    .cf-wrapper {
      display: flex;
      justify-content: center;
      margin: 0.5rem 0;
    }

    .btn-discord {
      width: 100%;
      background: #5865F2;
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease;
      text-decoration: none;
    }

    .btn-discord:hover {
      background: #4752C4;
    }

    .status-text {
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-brand">Kova Tech</div>
    <div class="auth-subtitle">Secure Gateway Access</div>

    <!-- Step 1: Cloudflare Turnstile Verification -->
    <div class="step-box active" id="stepCloudflare">
      <p class="status-text">Please complete the security check to proceed.</p>
      <div class="cf-wrapper">
        <!-- Replace sitekey with your actual Cloudflare Turnstile site key -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFsvW_f98gE-2GE_" data-callback="onCloudflareSuccess"></div>
      </div>
    </div>

    <!-- Step 2: Discord OAuth Authentication -->
    <div class="step-box" id="stepDiscord">
      <p class="status-text">Security verification passed. Sign in with your Discord account to continue.</p>
      <a href="#" id="discordLoginBtn" class="btn-discord">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Sign in with Discord
      </a>
    </div>
  </div>

  <script>
    // Configuration
    const CLIENT_ID = '1565735064002887976';
    const REDIRECT_URI = encodeURIComponent(window.location.origin + '/46466.html');
    
    // Set Discord OAuth link dynamically
    document.getElementById('discordLoginBtn').href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;

    // Triggered upon successful Cloudflare Turnstile completion
    function onCloudflareSuccess(token) {
      if (token) {
        document.getElementById('stepCloudflare').classList.remove('active');
        document.getElementById('stepDiscord').classList.add('active');
      }
    }
  </script>
</body>
</html>
